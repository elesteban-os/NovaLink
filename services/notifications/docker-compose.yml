services:
  postgres_notifications:
    image: postgres:15-alpine
    container_name: postgres_notifications
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novalink_network

  notifications_api:
    build: .
    container_name: notifications_api
    depends_on:
      postgres_notifications:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres_notifications
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_ECHO: ${DB_ECHO:-false}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8004
      RABBITMQ_HOST: ${RABBITMQ_HOST:-novalink-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "8006:8004"
    volumes:
      - .:/app
    networks:
      - novalink_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  notifications_worker:
    build: .
    container_name: notifications_worker
    restart: always
    depends_on:
      postgres_notifications:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres_notifications
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_ECHO: ${DB_ECHO:-false}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-novalink-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - .:/app
    networks:
      - novalink_network
    command: python -m app.infrastructure.event_worker run

volumes:
  notifications_db_data:

networks:
  novalink_network:
    external: true
