name: SAST y Análisis Estático Ligero

on:
  push:
    branches: ["main"]
    paths:
      - '**/*.py'
      - '.github/workflows/sast.yml'
  pull_request:
    branches: ["main"]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.3.0 flake8==6.1.0

      - name: Run Black formatter check
        run: black --check services/ || true

      - name: Run Flake8 linter
        run: flake8 services/ --max-line-length=88 --extend-ignore=E203,W503,E101,W191,E501,E402,F401,F841,F541 || true
