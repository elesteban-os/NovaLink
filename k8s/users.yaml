apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
spec:
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "users_user" # Ajustado para predeterminado
        - name: POSTGRES_PASSWORD
          value: "users_pass"
        - name: POSTGRES_DB
          value: "users_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: users-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
spec:
  selector:
    app: users-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
      - name: api
        image: users-api:v2.0
        imagePullPolicy: IfNotPresent # Como usarás Docker Desktop, esto toma la imagen construida localmente
        env:
        - name: DB_USER
          value: "users_user"
        - name: DB_PASSWORD
          value: "users_pass"
        - name: DB_NAME
          value: "users_db"
        - name: DB_HOST
          value: "users-db" # Nombre exacto del Service de K8s creado arriba
        - name: DB_PORT
          value: "5432"
        - name: DB_ECHO
          value: "false"
        - name: RABBITMQ_HOST
          value: "novalink-rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASSWORD
          value: "guest"
        - name: RABBITMQ_VHOST
          value: "/"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  type: LoadBalancer
  selector:
    app: users-api
  ports:
  - port: 8002
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-worker
spec:
  selector:
    matchLabels:
      app: users-worker
  template:
    metadata:
      labels:
        app: users-worker
    spec:
      containers:
      - name: worker
        image: users-api:v2.0
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.infrastructure.event_worker", "run"]
        env:
        - name: DB_USER
          value: "users_user"
        - name: DB_PASSWORD
          value: "users_pass"
        - name: DB_NAME
          value: "users_db"
        - name: DB_HOST
          value: "users-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_ECHO
          value: "false"
        - name: RABBITMQ_HOST
          value: "novalink-rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASSWORD
          value: "guest"
        - name: RABBITMQ_VHOST
          value: "/"