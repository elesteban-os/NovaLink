apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
spec:
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
      - name: frontend
        image: frontend:v2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-service
spec:
  type: LoadBalancer 
  selector:
    app: admin-frontend
  ports:
  - port: 8080 # http://localhost:8080
    targetPort: 80